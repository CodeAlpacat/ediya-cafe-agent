[project]
name = "ediya-cafe-agent"
version = "0.1.0"
description = "이디야 커피 주문 에이전트 — 로컬 Gemma 4 E2B + FastAPI + Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]>=0.34.0",
    "openai>=1.85.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "ollama: requires live Ollama daemon + gemma4:e2b model",
]
testpaths = ["app/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
