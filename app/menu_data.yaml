  - kr: "휘핑선택"
    en: "Whipped Cream"
    is_essential: false
    applicable_categories: ["coffee", "beverage", "flatccino"]
    options:
      - {kr: "휘핑추가", en: "Add Whipped Cream", price_delta: 500}
      - {kr: "휘핑빼기", en: "No Whipped Cream", price_delta: 0}

  - kr: "당도선택"
    en: "Sweetness"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "beverage", "bubble_tea", "flatccino", "ade"]
