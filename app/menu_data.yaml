# stock 필드 의미:
# - 없거나 null/-1 = 무한 재고 (기본값, 음료 카테고리 전반)
# - 0 = 품절 (당일 매진)
# - N (양수) = N개까지 주문 가능. 이미 카트에 있는 수량과 합쳐서 N 초과 시 INSUFFICIENT_STOCK 반환


# ====================
# 옵션 카테고리 (이디야 기준)
# ====================
option_categories:
  - kr: "사이즈"
    en: "Size"
    is_essential: false   # 기본 L. 사용자가 EX 명시 안 하면 L로 진행.
    options:
      - {kr: "라지", en: "Large", price_delta: 0}
      - {kr: "엑스트라", en: "Extra", price_delta: 1000}

  - kr: "샷추가"
    en: "Add Shot"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "decaf"]
    options:
      - {kr: "샷추가", en: "Add Shot", price_delta: 500}

  - kr: "시럽추가"
    en: "Syrup"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "decaf", "beverage"]
    options:
