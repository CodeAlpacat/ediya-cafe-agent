# 이디야커피 (Ediya Coffee) 메뉴 사전
# Source: shuttledelivery.co.kr Ediya menu (2025-12 사이즈 개편 반영)
# 사이즈: L (Large 18oz) / EX (Extra)
# 디카페인은 별도 카테고리(공식 분류 따름)

# ====================
# 카테고리 정의
# - descriptor: 임베딩 검색용 자연어 설명 (rag._menu_to_descriptor)
# - keywords:   키워드 검색용 트리거 어휘 (menu.keyword_menu_search)
# ====================
categories:
  coffee:
    descriptor: "커피 음료, 에스프레소 기반"
    keywords: ["커피", "아메리카노", "라떼"]
  cold_brew:
    descriptor: "콜드브루 커피, 깔끔하고 부드러운 맛"
    keywords: ["콜드브루"]
  decaf:
    descriptor: "디카페인 커피, 카페인 없음"
    keywords: ["디카페인"]
  beverage:
    descriptor: "비커피 음료, 부드러운 맛"
    keywords: ["음료", "밀크", "녹차"]
  tea:
    descriptor: "차, 카페인 적거나 없음, 향긋한 맛"
    keywords: ["차", "티"]
  bubble_tea:
    descriptor: "버블티, 쫄깃한 펄 들어간 달콤한 음료"
    keywords: ["버블", "버블티"]
  flatccino:
    descriptor: "플랫치노, 진하고 달콤한 블렌딩 음료"
    keywords: ["플랫치노", "프라푸치노", "프라페"]
  ade:
    descriptor: "에이드, 상큼하고 시원한 음료"
    keywords: ["에이드", "스무디"]
  bakery:
    descriptor: "베이커리, 빵/디저트"
    keywords: ["빵", "와플", "베이글", "프레첼"]
  ice_flakes:
    descriptor: "빙수, 시원한 디저트"
    keywords: ["빙수"]

