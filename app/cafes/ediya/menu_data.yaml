# stock 필드 의미:
# - 없거나 null/-1 = 무한 재고 (기본값, 음료 카테고리 전반)
# - 0 = 품절 (당일 매진)
# - N (양수) = N개까지 주문 가능. 이미 카트에 있는 수량과 합쳐서 N 초과 시 INSUFFICIENT_STOCK 반환


# ====================
# 옵션 카테고리 (이디야 기준)
# ====================
option_categories:
  - kr: "사이즈"
    en: "Size"
    is_essential: false   # 기본 L. 사용자가 EX 명시 안 하면 L로 진행.
    options:
      - {kr: "라지", en: "Large", price_delta: 0}
      - {kr: "엑스트라", en: "Extra", price_delta: 1000}

  - kr: "샷추가"
    en: "Add Shot"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "decaf"]
    options:
      - {kr: "샷추가", en: "Add Shot", price_delta: 500}

  - kr: "시럽추가"
    en: "Syrup"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "decaf", "beverage"]
    options:
      - {kr: "헤이즐넛시럽 추가", en: "Hazelnut Syrup", price_delta: 500}
      - {kr: "바닐라시럽 추가", en: "Vanilla Syrup", price_delta: 500}
      - {kr: "카라멜시럽 추가", en: "Caramel Syrup", price_delta: 500}
      - {kr: "흑당시럽 추가", en: "Brown Sugar Syrup", price_delta: 500}

  - kr: "휘핑선택"
    en: "Whipped Cream"
    is_essential: false
    applicable_categories: ["coffee", "beverage", "flatccino"]
    options:
      - {kr: "휘핑추가", en: "Add Whipped Cream", price_delta: 500}
      - {kr: "휘핑빼기", en: "No Whipped Cream", price_delta: 0}

  - kr: "당도선택"
    en: "Sweetness"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "beverage", "bubble_tea", "flatccino", "ade"]
    options:
      - {kr: "기본", en: "Standard", price_delta: 0}
      - {kr: "달게", en: "Sweet", price_delta: 0}
      - {kr: "덜달게", en: "Less Sweet", price_delta: 0}
      - {kr: "저당", en: "Low Sugar", price_delta: 0}

  - kr: "얼음선택"
    en: "Ice"
    is_essential: false
    applicable_categories: ["coffee", "cold_brew", "decaf", "beverage", "ade", "bubble_tea", "flatccino"]
    options:
      - {kr: "기본얼음", en: "Normal Ice", price_delta: 0}
      - {kr: "얼음적게", en: "Less Ice", price_delta: 0}
      - {kr: "얼음많이", en: "Extra Ice", price_delta: 0}
