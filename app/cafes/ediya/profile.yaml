# 이디야커피 카페 프로필.
#
# 카페를 교체하려면 app/cafes/<이름>/ 폴더에 아래 3개 파일을 두고
# CAFE_PROFILE 환경변수를 그 폴더 이름으로 지정한다:
#   - profile.yaml        (이 파일: 카페명 + 줄임말 맵)
#   - system_prompt.txt   (시스템 프롬프트 전문 — 도메인 규칙/few-shot 포함)
#   - menu_data.yaml      (메뉴/옵션/카테고리)

cafe_name: 이디야커피

# 손님이 쓰는 줄임말/은어 → 정식 메뉴명 후보.
# - 값이 1개: 온도까지 분명한 줄임말 → 정식 메뉴 직결.
# - 값이 여러 개: 모호한 줄임말 → 후보를 모두 띄워 모델이 되묻게 한다.
# 누구나 알아듣는 수준으로 정착된 표현만 보수적으로 등록한다.
slang_aliases:
  아아:
    - 아이스아메리카노
  아샷추:
    - 레몬아이스티
